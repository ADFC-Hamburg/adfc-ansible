- name: Docker compose pull
  ansible.builtin.command:
    chdir: "{{ docker_dir }}"
    argv:
      - docker
      - compose
      - pull
  delegate_to: "{{ dcp_node }}"

- name: Backup Hetzner volumes (live copy)
  ansible.builtin.include_tasks: backup_start.yml
  loop: "{{ dcp_backup_volumes }}"
  loop_control:
    loop_var: vol
  vars:
    dcp_backup_name: "backup-{{ vol.name }}-{{ dcp_backup_ts }}"

- name: Docker compose down
  ansible.builtin.command:
    chdir: "{{ docker_dir }}"
    argv:
      - docker
      - compose
      - down
      - --remove-orphans
  when: dcp_backup_volumes | length > 0
  delegate_to: "{{ dcp_node }}"

- name: Backup Hetzner volumes (final copy and detach)
  ansible.builtin.include_tasks: backup_finish.yml
  loop: "{{ dcp_backup_volumes }}"
  loop_control:
    loop_var: vol
  vars:
    dcp_backup_name: "backup-{{ vol.name }}-{{ dcp_backup_ts }}"

- name: Docker compose up
  ansible.builtin.command:
    chdir: "{{ docker_dir }}"
    argv:
      - docker
      - compose
      - up
      - -d
      - --remove-orphans
  delegate_to: "{{ dcp_node }}"

- name: Delete old Docker images
  ansible.builtin.command:
    argv:
      - docker
      - image
      - prune
      - --force
      - --all
  register: docker_image_prune
  changed_when: "'Total reclaimed space: 0B' not in docker_image_prune.stdout"
  delegate_to: "{{ dcp_node }}"
