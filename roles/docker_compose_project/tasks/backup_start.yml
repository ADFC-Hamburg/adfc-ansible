# Legt für ein Hetzner Volume (vol) ein Backup Volume an und kopiert die Daten
# ein erstes Mal, während die Anwendung noch läuft.
- name: Create backup volume {{ dcp_backup_name }}
  hetzner.hcloud.volume:
    api_token: "{{ hcloud_api_token }}"
    name: "{{ dcp_backup_name }}"
    size: "{{ vol.size_gb }}"
    server: "{{ dcp_node }}"
    format: ext4
    labels:
      "{{ docker_compose_backup_label }}": "true"
      compose-project: "{{ compose_project_name }}"
      source-volume: "{{ vol.name }}"
    state: present
  delegate_to: localhost
  register: dcp_backup_vol

- name: Mount backup volume {{ dcp_backup_name }}
  ansible.posix.mount:
    src: "{{ dcp_backup_vol.hcloud_volume.linux_device }}"
    path: "{{ docker_compose_backup_mount_base }}/{{ dcp_backup_name }}"
    opts: "discard,noatime"
    fstype: ext4
    state: ephemeral

- name: Rsync live data to backup volume {{ dcp_backup_name }}
  ansible.builtin.command:
    argv:
      - rsync
      - -aHAX
      - --numeric-ids
      - --delete
      - "{{ vol.mount }}/"
      - "{{ docker_compose_backup_mount_base }}/{{ dcp_backup_name }}/"
