# Die Rolle wird nur vom ersten Host des Plays ausgeführt. Alle Aktionen werden
# per delegate_to auf den jeweiligen Server ausgeführt, damit Projekte
# nacheinander (und mit minimaler Downtime) zwischen Servern verschoben werden
# können.
- name: Orchestrate compose projects
  ansible.builtin.include_tasks: orchestrate.yml
  when: inventory_hostname == ansible_play_hosts_all[0]
