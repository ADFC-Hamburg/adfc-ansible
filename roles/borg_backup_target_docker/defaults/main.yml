---
# https://github.com/tabacha/docker-borg-backup-server - Server-Gegenstueck
# zu docker-borg-backup (siehe roles/borg_server "adfc-borg-docker"). Laeuft
# auf den Rechnern, auf die gesichert WIRD (Inventory-Gruppe
# "backup_clients", z.B. adfc-hh-bak-1/2 - trotz des irrefuehrenden
# Gruppennamens die Ziel-/Speicherseite, nicht die Quellseite).
# adfc_borg_target_dir und adfc_borg_target_ssh_port stehen NICHT hier,
# sondern in group_vars/backup_clients.yml - roles/borg_server (Quellhosts,
# anderes Play) muss sie per hostvars[<zielbox>] lesen koennen, auch wenn
# diese Rolle im jeweiligen Play gar nicht laeuft. Reine Rollen-Defaults
# waeren dafuer nicht sichtbar. Siehe Kommentar dort.
adfc_borg_target_repo: https://github.com/tabacha/docker-borg-backup-server.git
adfc_borg_target_version: v1.1.0
adfc_borg_target_image_tag: "1.1.0"

# Watchtower fuer automatische Image-Updates statt Ansible-gesteuertem
# Pinning - Opt-in, weil sich das mit adfc_borg_target_image_tag
# widerspricht: ein fest gepinnter Versions-Tag aendert sich nie, Watchtower
# haette dann nichts zu tun. Aktiviert wechselt das Image bewusst auf
# adfc_borg_target_watchtower_tag (":latest") statt auf den gepinnten Tag -
# Kompromiss "immer aktuell" statt "kontrolliert getestet".
adfc_borg_target_watchtower_enabled: false
adfc_borg_target_watchtower_tag: latest
adfc_borg_target_watchtower_interval: 43200

# Unterverzeichnis auf der VORHANDENEN Backup-Platte (siehe
# playbooks/setup-backup-client.yml, mountet "/adfc-backup" schon) - bewusst
# ein ANDERER Pfad als die alten adfc-borg-pyenv-Repos
# (/adfc-backup/<hostname>), damit alte und neue Sicherungen nebeneinander
# existieren koennen, bis der Umstieg abgeschlossen ist.
adfc_borg_target_data_dir: /adfc-backup/docker-repos

# Backup-Keys (Quellhosts, die auf dieses Ziel schreiben duerfen) und
# Admin-Keys (volle, nicht append-only Rechte fuer admin-compact.sh/
# admin-shell.sh). Automatisch registrierte Backup-Keys der Quellhosts aus
# save_with_borg laufen NICHT hierueber, sondern ueber
# roles/borg_server/tasks/setup_client_docker_target.yml (adfc_borg_docker_uid
# des jeweiligen Quellhosts) - diese Liste ist fuer sonstige manuell zu
# registrierende Backup-Keys gedacht. Admin-Keys aus
# adfc_borg_target_admin_users (siehe unten) werden automatisch ergaenzt,
# diese Liste ist fuer zusaetzliche/Ausnahme-Admin-Keys.
#
# Seit docker-borg-backup-server v1.1.0 bekommt jede Identitaet einen
# eigenen Unix-Account (users/<uid>-<name>/, siehe dessen Release-Notes) -
# "uid" ist deshalb Pflicht und muss pro Zielrechner eindeutig sein (Bereich
# 1000-2000, siehe adfc_borg_target_admin_uids unten fuer die hier benutzte
# Konvention). "key_name" ist optional (Default: "name") und wird der
# Datei-Basisname unter keys/<role>/ - noetig, wenn eine Person mehrere
# Keys hat, siehe discover_admin_keys.yml. "version" ist optional (Name
# eines auf dem Server per Dockerfile BORG_VERSIONS installierten
# Borg-Binaries, z.B. "1.2.8" - ohne Angabe kommt die
# Server-Default-Version zum Einsatz).
#
# Beispiel:
#   adfc_borg_target_admin_keys:
#     - name: sven
#       uid: 1001
#       pubkey: "ssh-ed25519 AAAA... admin@example"
adfc_borg_target_backup_keys: []
adfc_borg_target_admin_keys: []

# Wer volle Admin-Rechte (prune/delete/compact) auf DIESER Zielbox
# bekommt - bewusst eine eigene Liste statt ssh_users_admins
# (group_vars/all.yml, roles/ssh_keys) direkt zu verwenden: Admin-Zugriff
# auf Backups ist sensibler als normaler SSH-Verwaltungszugriff auf die
# Rechner selbst, beide Listen sollen unabhaengig voneinander pflegbar
# bleiben, auch wenn sie aktuell identisch besetzt sind. Keys kommen aus
# ssh_keys/<name>/*.pub (gleiche Quelle/Konvention wie roles/ssh_keys,
# key_path/inventory_dir aus group_vars/all.yml) - siehe
# discover_admin_keys.yml. UID-Konvention: Quellhosts (adfc_borg_docker_uid
# in roles/borg_server) benutzen die 1000er, Admins hier bewusst die
# 1100er, damit beide Bereiche nie kollidieren.
adfc_borg_target_admin_users:
  - falkh
  - georgs
  - lucaf
  - svena
  - volkerk
  - patrickl
adfc_borg_target_admin_uids:
  falkh: 1101
  georgs: 1102
  lucaf: 1103
  svena: 1104
  volkerk: 1105
  patrickl: 1106
