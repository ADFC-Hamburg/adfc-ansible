---
# Fuer EINE bestehende Identitaet unter users/<uid>-<name>/ (adfc_borg_identity_dir,
# per Loop aus main.yml) deren Admin-Keys mit adfc_borg_target_admin_users
# abgleichen (hinzufuegen was fehlt, entfernen was nicht mehr in der Liste
# steht - analog roles/ssh_keys). Nur wenn die Identitaet ueberhaupt einen
# Backup-Key hat (keys/backup/*.pub) - reine, manuell angelegte
# Admin-Identitaeten (adfc_borg_target_admin_keys) laesst das unangetastet.
#
# Direkte Dateiverwaltung statt add-admin-key.sh: das Skript verweigert
# aktuell Admin-Keys fuer eine Identitaet, die schon eine Backup-Rolle hat
# (siehe Report an tabacha/docker-borg-backup-server). Sobald das dort
# behoben ist, koennte das ggf. wieder auf das Skript umgestellt werden -
# bis dahin schreiben/loeschen wir die Dateien unter keys/admin/ selbst und
# rufen reload-keys.sh manuell.

- name: "Pruefen ob {{ adfc_borg_identity_dir.path | basename }} ein Backup-Key hat"
  ansible.builtin.find:
    paths: "{{ adfc_borg_identity_dir.path }}/keys/backup"
    patterns: "*.pub"
    file_type: file
  register: adfc_borg_identity_backup_check

- name: "Admin-Keys fuer {{ adfc_borg_identity_dir.path | basename }} synchronisieren"
  when: adfc_borg_identity_backup_check.files | length > 0
  block:
    - name: adfc_borg_admin_desired zuruecksetzen
      ansible.builtin.set_fact:
        adfc_borg_admin_desired: []

    - name: Admin-Pubkey-Dateien der adfc_borg_target_admin_users suchen
      ansible.builtin.find:
        paths: "{{ inventory_dir }}/{{ key_path }}{{ item }}"
        patterns: "*.pub"
        recurse: true
        file_type: file
      loop: "{{ adfc_borg_target_admin_users }}"
      loop_control:
        label: "{{ item }}"
      delegate_to: localhost
      register: adfc_borg_admin_source_files

    - name: Gewuenschte Zieldateinamen bestimmen (<user>-<keyname>.pub)
      ansible.builtin.set_fact:
        adfc_borg_admin_desired: >-
          {{
            adfc_borg_admin_desired + [{
              'src': item.1.path,
              'dest_name': item.0.item ~ '-' ~ (item.1.path | basename | regex_replace('\.pub$', '')) ~ '.pub',
            }]
          }}
      loop: "{{ adfc_borg_admin_source_files.results | subelements('files') }}"
      loop_control:
        label: "{{ item.0.item }}/{{ item.1.path | basename }}"

    - name: Vorhandene Admin-Key-Dateien auf der Zielbox auflisten
      ansible.builtin.find:
        paths: "{{ adfc_borg_identity_dir.path }}/keys/admin"
        patterns: "*.pub"
        file_type: file
      register: adfc_borg_admin_existing

    - name: Fehlende Admin-Keys anlegen
      ansible.builtin.copy:
        src: "{{ item.src }}"
        dest: "{{ adfc_borg_identity_dir.path }}/keys/admin/{{ item.dest_name }}"
        mode: "0644"
        owner: root
        group: root
      loop: "{{ adfc_borg_admin_desired }}"
      loop_control:
        label: "{{ item.dest_name }}"
      register: adfc_borg_admin_keys_added

    - name: Nicht mehr gewuenschte Admin-Keys entfernen
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ adfc_borg_admin_existing.files }}"
      loop_control:
        label: "{{ item.path | basename }}"
      when: (item.path | basename) not in (adfc_borg_admin_desired | map(attribute='dest_name') | list)
      register: adfc_borg_admin_keys_removed

    - name: Keys neu laden, falls sich etwas geaendert hat
      ansible.builtin.command: ./reload-keys.sh
      args:
        chdir: "{{ adfc_borg_target_dir }}"
      when: >-
        (adfc_borg_admin_keys_added.results | selectattr('changed') | list | length > 0)
        or (adfc_borg_admin_keys_removed.results | selectattr('changed') | list | length > 0)
