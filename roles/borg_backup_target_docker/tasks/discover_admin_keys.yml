---
# Baut adfc_borg_target_admin_keys_auto aus adfc_borg_target_admin_users:
# ein Eintrag pro *.pub-Datei unter ssh_keys/<user>/ (gleiche Quelle/
# Konvention wie roles/ssh_keys, key_path/inventory_dir aus
# group_vars/all.yml). UID kommt aus adfc_borg_target_admin_uids (siehe
# group_vars/backup_clients.yml) - fester, in Ansible vergebener Wert pro
# Person statt vom Zielserver automatisch (gleiche Begruendung wie
# adfc_borg_docker_uid in roles/borg_server).

- name: Pubkey-Dateien der adfc_borg_target_admin_users suchen
  ansible.builtin.find:
    paths: "{{ inventory_dir }}/{{ key_path }}{{ item }}"
    patterns: "*.pub"
    recurse: true
    file_type: file
  loop: "{{ adfc_borg_target_admin_users }}"
  loop_control:
    label: "{{ item }}"
  delegate_to: localhost
  register: adfc_borg_target_admin_key_files

- name: adfc_borg_target_admin_keys_auto zusammenstellen
  ansible.builtin.set_fact:
    adfc_borg_target_admin_keys_auto: >-
      {{
        adfc_borg_target_admin_keys_auto | default([]) + [{
          'name': item.0.item,
          'key_name': (item.1.path | basename | regex_replace('\.pub$', '')),
          'uid': adfc_borg_target_admin_uids[item.0.item],
          'pubkey': lookup('file', item.1.path),
        }]
      }}
  loop: "{{ adfc_borg_target_admin_key_files.results | subelements('files') }}"
  loop_control:
    label: "{{ item.0.item }}/{{ item.1.path | basename }}"
