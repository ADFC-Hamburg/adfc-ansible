---
docker_repo_helper_packages:
  - apt-transport-https
  - ca-certificates
  - curl
  - gnupg-agent
  - software-properties-common
  - python3-pip
docker_packages:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-compose-plugin
  - python3-docker
  - apparmor
# Docker bietet je Distribution ein eigenes Repo unter demselben Muster
# (".../linux/debian", ".../linux/ubuntu", ...) - ansible_distribution
# passt dafuer schon (Debian/Ubuntu), nur klein geschrieben. Fest auf
# "debian" gepinnt haette auf Ubuntu-Hosts (falscher Codename fuers
# Debian-Repo, z.B. "noble") mit "does not have a Release file" gebrochen.
docker_repo_gpg_key: "https://download.docker.com/linux/{{ ansible_distribution | lower }}/gpg"
docker_repo_gpg_key_dest: /etc/apt/trusted.gpg.d/docker.asc
docker_repo_gpg_key_gpg: /etc/apt/trusted.gpg.d/docker.gpg
docker_repo_url: "https://download.docker.com/linux/{{ ansible_distribution | lower }}"
