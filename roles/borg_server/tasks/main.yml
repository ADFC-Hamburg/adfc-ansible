---
# Borg ist im Moment haendisch unt
- name: Installiere pakete
  ansible.builtin.apt:
    name:
      - python3-pip
      - python3-venv
      - cython3
      - libacl1-dev
      - libssl-dev
      - python3-virtualenv
      - python3-dev
      - build-essential
  tags: borg-server

# - name: Install virtualenv via pip
#  ansible.builtin.pip:
#    name: virtualenv
#    executable: pip3

# Demnächst:
# - name: Delete venv
#  ansible.builtin.file:
#    name: /usr/local/share/borg-venv
#    state: absent

- name: Create dir
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  loop:
    - /usr/local/share/adfc-borg
    - /usr/local/share/adfc-borg/bin
    - /usr/local/share/adfc-borg/clients
    - /usr/local/share/adfc-borg/lock
    - /usr/local/share/adfc-borg/tried
    - /usr/local/share/adfc-borg/success

- name: Get borg binary
  ansible.builtin.get_url:
    url: https://github.com/borgbackup/borg/releases/download/{{ borg_bin_version }}/borg-linux64
    dest: /usr/local/share/adfc-borg/bin/borg-{{ borg_bin_version }}-linux64
    mode: "0755"
    owner: root
    group: root
    checksum: sha256:{{ borg_bin_sha256_sum }}
# Alter Weg venv erstellen:
# - name: Install borg
#  ansible.builtin.pip:
#    name:
#      - wheel
#      - cython
#      - borgbackup==1.1.15
#    virtualenv: /usr/local/share/borg-venv
#  vars:
#    ansible_python_interpreter: /usr/bin/python3
#  tags: borg-server

- name: Sysmlink borg executable
  ansible.builtin.file:
    src: /usr/local/share/adfc-borg/bin/borg-{{ borg_bin_version }}-linux64
    dest: /usr/local/bin/{{ item }}
    state: link
  with_items:
    - borg
    - borgfs
  tags: borg-server

- name: Create Borgbackup Server Key
  ansible.builtin.command: ssh-keygen -t rsa -b 4096 -f /root/.ssh/borgbackup-server -N '' -C 'borgbackup-server-key adfc gst'
  args:
    creates: /root/.ssh/borgbackup-server
  tags: borg-server

- name: Install adfc-borg wrapper and backend scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    mode: "0755"
  loop:
    - { src: adfc-borg.j2, dest: /usr/local/sbin/adfc-borg }
    - { src: adfc-borg-pyenv.j2, dest: /usr/local/sbin/adfc-borg-pyenv }
    - { src: adfc-borg-docker.j2, dest: /usr/local/sbin/adfc-borg-docker }
  tags: borg-server,adfc-borg

- name: Set adfc-borg client-version
  ansible.builtin.copy:
    content: "{{ adfc_borg_client_version }}\n"
    dest: /usr/local/share/adfc-borg/client-version
    mode: "0644"
    owner: root
    group: root
  tags: borg-server,adfc-borg

- name: Deploy docker-borg-backup client
  ansible.builtin.include_tasks: deploy_docker_client.yml
  when: adfc_borg_docker_enabled | default(false) or adfc_borg_client_version == 'docker'
  tags: borg-server,adfc-borg,adfc-borg-docker

- name: Setup docker-borg-backup targets
  ansible.builtin.include_tasks: setup_client_docker_target.yml
  loop: "{{ groups['backup_clients'] }}"
  loop_control:
    loop_var: backup_client
  when: adfc_borg_docker_enabled | default(false) or adfc_borg_client_version == 'docker'
  tags: borg-server,adfc-borg,adfc-borg-docker

- name: Keyscan of clients
  ansible.builtin.command:
    argv:
      - ssh-keyscan
      - localhost
  delegate_to: "{{ item }}"
  changed_when: false
  loop: "{{ groups['backup_clients'] }}"
  register: backup_clients_keyscan
  tags: borg-server,adfc-borg,borg-keyscan

- name: Output Keyscan
  ansible.builtin.copy:
    content: |
      {% for res in backup_clients_keyscan.results %}
      {% for line in res.stdout_lines | sort %}
      {{ res.item }}{{ line | regex_replace('^localhost', '') }}
      {% endfor %}
      {% endfor %}
    dest: /usr/local/share/adfc-borg/known_hosts
    mode: "0644"
    owner: root
    group: root
  tags: borg-server,adfc-borg,borg-keyscan

- name: Install ssh-config
  ansible.builtin.template:
    src: ssh-config.j2
    dest: /usr/local/share/adfc-borg/ssh-config
    mode: "0644"
  tags: borg-server,adfc-borg

- name: Setup Cronjob
  ansible.builtin.cron:
    name: adfc-borg
    minute: "{{ borg_cron_minute }}"
    hour: "{{ borg_cron_hour }}"
    user: root
    job: /usr/local/sbin/adfc-borg cron >/dev/null
    cron_file: ansible_adfc-borg
  tags: borg-server

- name: Install logrotate script
  ansible.builtin.template:
    src: logrotate.j2
    dest: /etc/logrotate.d/adfc-borg
    mode: "0644"
  tags: borg-server

- name: Get Borgbackup key
  ansible.builtin.slurp:
    src: /root/.ssh/borgbackup-server.pub
  register: borgbackupkey
  tags:
    - borg-server
    - adfc-borg
    - backup_client

- name: Setup Backup client
  ansible.builtin.include_tasks: setup_client.yml
  loop: "{{ groups['backup_clients'] }}"
  loop_control:
    loop_var: backup_client
  tags:
    - borg-server
    - adfc-borg
    - backup_client
