ssh_users_admins:
  - svena
  - volkerk
  - georgs
borg_create_pre_job: >-
  /root/maintenance/borg-backup-helper
borg_save_path: "/opt/openbikesensor /etc /root/backups/borg"
borg_save_exclude_dirs:
  - /tmp
public_ipv4: "{{ lookup('dig', inventory_hostname, 'qtype=A') }}"
borg_cron_hour: "5"
borg_cron_minute: "9"
borg_client_user: "borg-obs"

# docker-borg-backup Testmigration (siehe roles/borg_server) - wie tools2,
# adfc_borg_client_version bleibt "pyenv". adfc_borg_docker_targets
# vorerst nur adfc-hh-bak-1 (adfc-hh-bak-2 noch nicht deployed).
adfc_borg_docker_uid: 1003
adfc_borg_docker_enabled: true
adfc_borg_docker_targets:
  - adfc-hh-bak-1
